# Copia de seguridad semanal de la base de datos de Supabase.
# Corre todos los domingos a las 3:00 (hora Argentina) y también a mano desde
# GitHub → Actions → "Copia de seguridad" → Run workflow.
# El archivo queda CIFRADO (el repositorio es público): solo se abre con tu clave
# BACKUP_CLAVE. Se guarda 90 días en la pestaña Actions del repositorio.
# Necesita dos secretos del repositorio (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL  → cadena de conexión "Session pooler" de Supabase (con tu contraseña de la base)
#   BACKUP_CLAVE     → una frase larga que inventes y guardes en un lugar seguro
name: Copia de seguridad

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verificar secretos
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          CLAVE: ${{ secrets.BACKUP_CLAVE }}
        run: |
          if [ -z "$DB" ] || [ -z "$CLAVE" ]; then
            echo "::error::Faltan los secretos SUPABASE_DB_URL y/o BACKUP_CLAVE (ver instrucciones al inicio de este archivo)."
            exit 1
          fi

      - name: Instalar pg_dump 17 (misma versión que Supabase)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Exportar la base
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          PG=/usr/lib/postgresql/17/bin
          mkdir respaldo
          # 1) Todo lo tuyo: tablas, datos, funciones, políticas de seguridad (esquema public)
          $PG/pg_dump "$DB" --schema=public --no-owner --no-privileges --format=custom --file=respaldo/public.dump
          # 2) Usuarios (cuentas y correos) — solo datos, para poder recuperarlos
          $PG/pg_dump "$DB" --data-only --table=auth.users --table=auth.identities --format=custom --file=respaldo/usuarios.dump \
            || echo "::warning::No se pudieron exportar los usuarios (auth). El resto del respaldo está completo."
          # 3) Tareas programadas (pg_cron)
          $PG/psql "$DB" -At -c "select json_agg(row_to_json(j)) from (select jobname, schedule, command from cron.job) j" > respaldo/tareas-programadas.json || true
          date -u +"%Y-%m-%dT%H:%M:%SZ" > respaldo/fecha.txt
          ls -la respaldo

      - name: Cifrar
        env:
          CLAVE: ${{ secrets.BACKUP_CLAVE }}
        run: |
          NOMBRE="respaldo-$(date -u +%Y-%m-%d)"
          tar -czf "$NOMBRE.tar.gz" respaldo
          gpg --batch --yes --pinentry-mode loopback --passphrase "$CLAVE" --symmetric --cipher-algo AES256 -o "$NOMBRE.tar.gz.gpg" "$NOMBRE.tar.gz"
          rm -rf respaldo "$NOMBRE.tar.gz"
          echo "NOMBRE=$NOMBRE" >> "$GITHUB_ENV"

      - name: Guardar (90 días)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOMBRE }}
          path: ${{ env.NOMBRE }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
