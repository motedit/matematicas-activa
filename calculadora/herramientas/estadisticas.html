<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Estadísticas de uso · Matemática paso a paso</title>
<!-- Panel de estadísticas anónimas (js/estadisticas.js). Lee los datos de:
     este navegador, un archivo exportado desde la calculadora (Opciones →
     Exportar mis estadísticas) o el servidor (Supabase, con la clave). -->
<link rel="stylesheet" href="../lib/fuentes/fuentes.css">
<style>
:root{--ink:#0e1f33;--ink-soft:#4b6580;--btn:#1b6ec2;--paper:#eef3f8;--panel:#fff;--line:#e4ecf3;--blue:#1b6ec2;--barra:#1b6ec2;--teal:#17a398;--bg:#0d1b2a;--bg2:#15304c;--shadow:0 1px 2px rgba(14,31,51,.06),0 4px 14px rgba(14,31,51,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6eef7;--ink-soft:#97abc0;--paper:#0b1624;--panel:#12233a;--line:#22385a;--barra:#4a95dc;--blue:#6aaaf0;--shadow:none;--mal:#ff8f7a}}
:root[data-theme="dark"]{--ink:#e6eef7;--ink-soft:#97abc0;--paper:#0b1624;--panel:#12233a;--line:#22385a;--barra:#4a95dc;--blue:#6aaaf0;--shadow:none;--mal:#ff8f7a}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:15px}
header{background:linear-gradient(100deg,var(--bg),var(--bg2));color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
header h1{margin:0;font-family:Sora,sans-serif;font-size:1.1rem;margin-right:auto}
main{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
.fuente{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:14px}
.fuente input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);min-width:0;flex:1 1 180px}
button,.boton{font:inherit;font-weight:600;border:0;border-radius:10px;padding:8px 14px;background:var(--btn);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--blue);border:1px solid var(--line)}
.filtros{display:flex;gap:6px;align-items:center;margin:0 0 14px;flex-wrap:wrap}
.filtros span{font-size:.82rem;color:var(--ink-soft);margin-right:4px}
.filtros button[aria-pressed="true"]{background:var(--btn);color:#fff}.filtros button{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
#estado{font-size:.84rem;color:var(--ink-soft);margin-left:auto}
header .boton{background:var(--btn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:Sora,sans-serif;font-size:1.7rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.82rem;color:var(--ink-soft)}
.grilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:14px}
.tarjeta{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.tarjeta h2{font-family:Sora,sans-serif;font-size:1rem;margin:0 0 2px}
.tabla-op{overflow-x:auto}.tabla-op table{width:100%;border-collapse:collapse;font-size:.84rem}.tabla-op th,.tabla-op td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}.tabla-op th{font-size:.75rem;color:var(--ink-soft);font-weight:700}.tabla-op tr.mal td:nth-child(4){color:var(--mal,#b83a26);font-weight:700}
.tarjeta .sub{font-size:.8rem;color:var(--ink-soft);margin:0 0 10px}
.barras{display:flex;flex-direction:column;gap:5px}
.fila{display:grid;grid-template-columns:minmax(110px,38%) 1fr auto;gap:8px;align-items:center;font-size:.84rem;border-radius:6px;padding:2px 4px}
.fila:hover{background:var(--paper)}
.fila .et{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.fila .et small{color:var(--ink-soft)}
.pista{height:14px;background:transparent;border-radius:0 4px 4px 0}
.pista i{display:block;height:100%;background:var(--barra);border-radius:0 4px 4px 0;min-width:2px}
.fila .v{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:.8rem;min-width:3ch;text-align:right}
.columnas{display:flex;align-items:flex-end;gap:2px;height:160px;border-bottom:1px solid var(--line);position:relative;padding-top:8px}
.col{flex:1;display:flex;align-items:flex-end;height:100%;position:relative;cursor:default}
.col i{display:block;width:100%;background:var(--barra);border-radius:4px 4px 0 0;min-height:1px}
.col:hover i{filter:brightness(1.15)}
.ejex{display:flex;justify-content:space-between;font-size:.72rem;color:var(--ink-soft);margin-top:4px}
#tip{position:fixed;pointer-events:none;background:var(--bg);color:#e3eef9;font-size:.8rem;padding:6px 10px;border-radius:8px;opacity:0;transition:opacity .1s;z-index:9}
details{margin-top:8px;font-size:.82rem}details summary{cursor:pointer;color:var(--blue)}
table{border-collapse:collapse;width:100%;margin-top:6px;font-size:.82rem}th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}th{color:var(--ink-soft);font-weight:600}td.n{text-align:right;font-variant-numeric:tabular-nums}
.vacio{color:var(--ink-soft);font-size:.86rem;padding:20px 0;text-align:center}
.ancho{grid-column:1/-1}
</style>
</head>
<body>
<header><h1>Estadísticas de uso · Matemática paso a paso</h1><a class="boton" href="../Matem%C3%A1tica%20paso%20a%20paso.html" style="text-decoration:none">Volver a la calculadora</a></header>
<main>
  <div class="fuente">
    <b style="font-size:.86rem">Datos:</b>
    <button type="button" id="usarLocal">Este navegador</button>
    <label class="boton sec" style="background:transparent;color:var(--blue);border:1px solid var(--line)">Abrir archivo exportado<input type="file" id="archivo" accept="application/json" hidden></label>
    <input id="sbUrl" placeholder="https://xxxx.supabase.co" aria-label="Dirección de Supabase"><input id="sbClave" placeholder="Clave pública (anon key)" aria-label="Clave pública"><input id="sbDocente" type="password" placeholder="Clave de estadísticas" aria-label="Clave de estadísticas">
    <button type="button" id="usarServidor">Traer del servidor</button>
  </div>
  <div class="filtros" role="group" aria-label="Período"><span>Período:</span><button type="button" data-dias="7">7 días</button><button type="button" data-dias="30" aria-pressed="true">30 días</button><button type="button" data-dias="90">90 días</button><button type="button" data-dias="0">Todo</button><span id="estado"></span></div>
  <div class="kpis" id="kpis"></div>
  <div class="grilla" id="grilla"></div>
</main>
<div id="tip" aria-hidden="true"></div>
<script>
'use strict';
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const AREAS = { arit: 'Aritmética', alg: 'Álgebra', geo: 'Geometría analítica', trig: 'Geometría y trigonometría', calc: 'Cálculo diferencial', integ: 'Cálculo integral', est: 'Estadística' };
const FUNCIONES = { pista: 'Pista (paso siguiente)', ver_todo: 'Ver toda la resolución', porque: '¿Por qué?', comprobar: 'Comprobar respuesta', parecido: 'Ejercicio parecido', practica: 'Práctica', grafico: 'Gráfico del ejercicio', graficador: 'Graficador', voz: 'Escuchar', pdf: 'PDF', imagen: 'Imagen', enlace: 'Enlace', foto: 'Foto', fichas: 'Fichas', asistente: 'Asistente con IA', ver_clase: 'Ver la clase', pizarra: 'A la pizarra', comparar: 'Comparar métodos', word: 'Exportar a Word', latex: 'Exportar a LaTeX' };
let todos = [], dias = 30;
const nf = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 1 });
function contar(lista, clave) { const m = new Map(); lista.forEach(e => { const k = clave(e); if (k) m.set(k, (m.get(k) || 0) + 1); }); return [...m.entries()].sort((a, b) => b[1] - a[1]); }
// Barras horizontales (una sola serie: un color, valor al final, tooltip y tabla)
function barras(titulo, sub, filas, { formato = v => nf.format(v), unidad = '', max = 12, ancho = false } = {}) {
  const top = filas.slice(0, max), mx = Math.max(1, ...top.map(f => f[1]));
  const cuerpo = top.length ? `<div class="barras">${top.map(([k, v]) => `<div class="fila" data-tip="${esc(k)}: ${esc(formato(v))}${unidad}"><span class="et">${k}</span><span class="pista"><i style="width:${(100 * v / mx).toFixed(1)}%"></i></span><span class="v">${esc(formato(v))}</span></div>`).join('')}</div>` : '<p class="vacio">Todavía no hay datos.</p>';
  const tabla = top.length ? `<details><summary>Ver como tabla</summary><table><thead><tr><th>${esc(titulo)}</th><th>Valor</th></tr></thead><tbody>${filas.map(([k, v]) => `<tr><td>${k}</td><td class="n">${esc(formato(v))}</td></tr>`).join('')}</tbody></table></details>` : '';
  return `<section class="tarjeta${ancho ? ' ancho' : ''}"><h2>${esc(titulo)}</h2><p class="sub">${esc(sub)}</p>${cuerpo}${tabla}</section>`;
}
function porDia(ev) {
  const n = dias || Math.max(1, Math.ceil((Date.now() - Math.min(...ev.map(e => e.f), Date.now())) / 864e5)), hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const cols = Array.from({ length: Math.min(n, 120) }, (_, i) => { const d = new Date(hoy - (Math.min(n, 120) - 1 - i) * 864e5); return { d, v: 0 }; });
  ev.filter(e => e.ev === 'resolver' || e.ev === 'practica').forEach(e => { const d = new Date(e.f); d.setHours(0, 0, 0, 0); const c = cols.find(x => +x.d === +d); if (c) c.v++; });
  const mx = Math.max(1, ...cols.map(c => c.v)), f = d => d.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });
  return `<section class="tarjeta ancho"><h2>Ejercicios resueltos por día</h2><p class="sub">Incluye los de práctica.</p><div class="columnas">${cols.map(c => `<div class="col" data-tip="${f(c.d)}: ${c.v} ejercicio${c.v === 1 ? '' : 's'}"><i style="height:${(100 * c.v / mx).toFixed(1)}%"></i></div>`).join('')}</div><div class="ejex"><span>${f(cols[0].d)}</span><span>${f(cols[cols.length - 1].d)}</span></div>
    <details><summary>Ver como tabla</summary><table><thead><tr><th>Día</th><th>Ejercicios</th></tr></thead><tbody>${cols.filter(c => c.v).map(c => `<tr><td>${f(c.d)}</td><td class="n">${c.v}</td></tr>`).join('')}</tbody></table></details></section>`;
}
function pintar() {
  const desde = dias ? Date.now() - dias * 864e5 : 0, ev = todos.filter(e => e.f >= desde);
  const res = ev.filter(e => e.ev === 'resolver' || e.ev === 'practica'), noRec = ev.filter(e => e.ev === 'no_reconocido'), pistas = ev.filter(e => e.ev === 'pista'), comp = ev.filter(e => e.ev === 'comprobar');
  const sesiones = new Set(ev.map(e => e.s)).size, bien = comp.filter(e => e.resultado === 'bien').length;
  $('#kpis').innerHTML = [[res.length, 'ejercicios resueltos'], [sesiones, 'visitas'], [res.length + noRec.length ? nf.format(100 * noRec.length / (res.length + noRec.length)) + ' %' : '—', 'ejercicios no reconocidos'], [res.length ? nf.format(pistas.length / res.length) : '—', 'pistas por ejercicio'], [comp.length ? nf.format(100 * bien / comp.length) + ' %' : '—', 'respuestas correctas al comprobar']]
    .map(([v, t]) => `<div class="kpi"><b>${v}</b><span>${t}</span></div>`).join('');
  const nombre = e => `${esc(e.nt || e.tema || '?')} <small>· ${esc(AREAS[e.a] || e.a || '')}</small>`;
  // pistas promedio por tema (temas con al menos 3 ejercicios)
  const porTema = new Map(); res.forEach(e => { const k = nombre(e); const x = porTema.get(k) || { r: 0, p: 0 }; x.r++; porTema.set(k, x); });
  pistas.forEach(e => { const k = nombre(e); const x = porTema.get(k); if (x) x.p++; });
  const pistasTema = [...porTema.entries()].filter(([, x]) => x.r >= 3).map(([k, x]) => [k, x.p / x.r]).sort((a, b) => b[1] - a[1]);
  const usoFunc = contar(ev.filter(e => FUNCIONES[e.ev]), e => FUNCIONES[e.ev]);
  $('#grilla').innerHTML = porDia(ev) +
    barras('Temas más resueltos', 'Cantidad de ejercicios resueltos por tema.', contar(res, nombre)) +
    barras('Dónde se piden más pistas', 'Pistas por ejercicio, en temas con 3 o más ejercicios. Buen indicador de qué clase grabar.', pistasTema, { formato: v => nf.format(v) }) +
    barras('Errores más comunes al comprobar', 'Lo primero que se marcó como error en la respuesta del alumno.', contar(comp.filter(e => e.nota), e => esc(e.nota))) +
    barras('Conceptos más consultados en “¿Por qué?”', 'Qué explicaciones se abren más.', contar(ev.filter(e => e.ev === 'porque' && e.concepto), e => esc(e.concepto))) +
    revisar(ev.filter(e => e.ev === 'opinion')) +
    barras('Funciones más usadas', 'Cuántas veces se usó cada herramienta.', usoFunc) +
    barras('Ejercicios que no se reconocieron', 'Lo que se escribió y la calculadora no supo resolver: ideas para nuevos temas.', contar(noRec, e => `${esc(e.texto)} <small>· ${esc(AREAS[e.a] || '')}</small>`), { max: 25, ancho: true });
  $('#estado').textContent = `${ev.length} eventos en el período · ${todos.length} en total`;
}
// "¿Te sirvió?": pasos con más votos negativos y por qué
function revisar(op) {
  const m = new Map();
  op.forEach(e => { const k = `${e.a}|${e.nt || e.tema}|${e.paso}`; const x = m.get(k) || { a: e.a, nt: e.nt || e.tema, paso: e.paso, si: 0, no: 0, mot: new Map() }; e.util ? x.si++ : x.no++; if (e.motivo) x.mot.set(e.motivo, (x.mot.get(e.motivo) || 0) + 1); m.set(k, x); });
  const filas = [...m.values()].sort((p, q) => q.no - p.no || p.si - q.si).slice(0, 20);
  const total = op.length, utiles = op.filter(e => e.util).length;
  const cuerpo = filas.length ? `<div class="tabla-op" role="region" aria-label="Explicaciones a revisar" tabindex="0"><table><thead><tr><th scope="col">Paso</th><th scope="col">Tema</th><th scope="col">👍</th><th scope="col">👎</th><th scope="col">Útil</th><th scope="col">Motivo más común</th></tr></thead><tbody>${filas.map(x => { const mm = [...x.mot.entries()].sort((p, q) => q[1] - p[1])[0]; const pct = 100 * x.si / (x.si + x.no); return `<tr${x.no > x.si ? ' class="mal"' : ''}><td>${esc(x.paso)}</td><td>${esc(x.nt)} <small>· ${esc(AREAS[x.a] || x.a || '')}</small></td><td>${x.si}</td><td>${x.no}</td><td>${nf.format(pct)} %</td><td>${mm ? `${esc(mm[0])} (${mm[1]})` : '—'}</td></tr>`; }).join('')}</tbody></table></div>` : '<p class="vacio">Todavía nadie votó “¿Te sirvió?”.</p>';
  return `<section class="tarjeta ancho"><h2>Explicaciones a revisar</h2><p class="sub">Votos de “¿Te sirvió?” en cada paso${total ? ` · ${nf.format(100 * utiles / total)} % útiles en total (${total} votos)` : ''}. Arriba, los pasos con más votos negativos: los primeros para mejorar.</p>${cuerpo}</section>`;
}
function cargar(lista, origen) { todos = (lista || []).map(e => (e && e.datos ? { ...e.datos, f: e.datos.f || Date.parse(e.creado) } : e)).filter(e => e && e.ev && e.f); $('#estado').textContent = origen; pintar(); }
$('#usarLocal').onclick = () => { try { cargar(JSON.parse(localStorage.getItem('mpp-eventos') || '[]'), 'Este navegador'); } catch (e) { cargar([], 'Sin datos en este navegador'); } };
$('#archivo').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => cargar(JSON.parse(t), f.name)).catch(() => alert('El archivo no es válido.')); };
$('#usarServidor').onclick = async () => {
  const u = $('#sbUrl').value.trim().replace(/\/$/, ''), k = $('#sbClave').value.trim(), c = $('#sbDocente').value;
  if (!u || !k || !c) { $('#estado').textContent = 'Completá la dirección, la clave pública y la clave de estadísticas.'; return; }
  try { localStorage.setItem('mpp-est-servidor', JSON.stringify({ u, k })); } catch (e) { /* sin almacenamiento */ }
  $('#estado').textContent = 'Trayendo…';
  try { const r = await fetch(u + '/rest/v1/rpc/eventos_recientes', { method: 'POST', headers: { apikey: k, Authorization: 'Bearer ' + k, 'Content-Type': 'application/json' }, body: JSON.stringify({ clave: c, dias: 365 }) }); if (!r.ok) throw new Error(r.status); cargar(await r.json(), 'Servidor'); }
  catch (e) { $('#estado').textContent = 'No pude conectarme (' + e.message + ').'; }
};
document.querySelectorAll('[data-dias]').forEach(b => b.onclick = () => { dias = +b.dataset.dias; document.querySelectorAll('[data-dias]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); pintar(); });
document.addEventListener('mousemove', e => { const t = e.target.closest('[data-tip]'), tip = $('#tip'); if (!t) { tip.style.opacity = 0; return; } tip.innerHTML = t.dataset.tip.replace(/&lt;small&gt;|&lt;\/small&gt;/g, ''); tip.style.opacity = 1; tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = e.clientY + 14 + 'px'; });
try { const s = JSON.parse(localStorage.getItem('mpp-est-servidor') || 'null'); if (s) { $('#sbUrl').value = s.u; $('#sbClave').value = s.k; } } catch (e) { /* nada */ }
$('#usarLocal').onclick();
</script>
</body>
</html>
