<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Códigos de activación · Matemática paso a paso</title>
<!-- Herramienta para el docente: genera la "huella" (SHA-256) de un código de la versión completa.
     Copiá la huella en datos/plataforma.json → planes.codigos (y en plataforma.js).
     El código en sí se lo das al alumno; en la configuración solo queda la huella. -->
<link rel="stylesheet" href="../lib/fuentes/fuentes.css">
<style>
  body{font-family:Inter,system-ui,sans-serif;background:#eef3f8;color:#0e1f33;margin:0}
  header{background:linear-gradient(100deg,#0d1b2a,#15304c);color:#fff;padding:16px 22px}h1{margin:0;font-family:Sora,sans-serif;font-size:1.1rem}
  main{max-width:720px;margin:0 auto;padding:20px}.caja{background:#fff;border:1px solid #e4ecf3;border-radius:14px;padding:18px}
  input,textarea{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid #e4ecf3;border-radius:10px;margin:6px 0 12px}
  textarea{font-family:'Space Mono',monospace;font-size:.82rem;min-height:120px}
  button{font:inherit;border:0;border-radius:10px;padding:10px 18px;background:#17a398;color:#fff;font-weight:700;cursor:pointer;margin-right:8px}
  label{font-size:.78rem;font-weight:600;color:#5a748c;text-transform:uppercase;letter-spacing:.3px}
</style>
</head>
<body>
<header><h1>Códigos de activación de la versión completa</h1></header>
<main><div class="caja">
  <label for="codigo">Código para el alumno (uno o varios, uno por línea)</label>
  <textarea id="codigo" placeholder="MATE-2026-ABCD"></textarea>
  <button id="generar">Generar huellas</button><button id="aleatorio" style="background:#1b6ec2">Inventar 5 códigos</button>
  <label for="salida" style="display:block;margin-top:14px">Huellas para pegar en "codigos" (datos/plataforma.json)</label>
  <textarea id="salida" readonly></textarea>
  <label for="sql" style="display:block">Si usás el servidor (Supabase): pegá esto en el SQL Editor</label>
  <textarea id="sql" readonly></textarea>
</div></main>
<script>
const hex = async t => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t.trim().toUpperCase())))].map(b => b.toString(16).padStart(2, '0')).join('');
document.getElementById('generar').onclick = async () => {
  const lineas = document.getElementById('codigo').value.split('\n').map(s => s.trim()).filter(Boolean);
  const hs = await Promise.all(lineas.map(hex)); document.getElementById('salida').value = JSON.stringify(hs, null, 2);
  document.getElementById('sql').value = hs.map(h => `insert into public.codigos (hash) values ('${h}');`).join('\n');
};
document.getElementById('aleatorio').onclick = () => {
  const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', uno = () => 'MATE-' + new Date().getFullYear() + '-' + Array.from(crypto.getRandomValues(new Uint8Array(4)), b => L[b % L.length]).join('');
  document.getElementById('codigo').value = Array.from({ length: 5 }, uno).join('\n'); document.getElementById('generar').onclick();
};
</script>
</body>
</html>
